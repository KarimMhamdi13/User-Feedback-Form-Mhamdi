<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Feedback Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <h1>User Feedback</h1>
    
    <form id="feedback-form">
      <label for="name">Name:</label>
      <input type="text" id="name" placeholder="Enter your name">
      <small class="tooltip">Please enter your full name.</small>

      <label for="email">Email:</label>
      <input type="email" id="email" placeholder="Enter your email">
      <small class="tooltip">Your e-mail will not be shared with others.</small>

      <label for="comments">Comments:</label>
      <textarea id="comments" placeholder="Write your feedback..." maxlength="200"></textarea>
      <div id="char-count">0 / 200</div>

      <button type="submit">Submit Feedback</button>
    </form>

    <h2>Submitted Feedback</h2>
    <div id="feedback-display"></div>
  </div>

  <script src="cp_1.js"></script>
</body>
</html>
